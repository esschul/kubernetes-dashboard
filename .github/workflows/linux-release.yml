name: Linux release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload to (e.g. v1.1.57)'
        required: true

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Set version from release tag
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Build Linux AppImage
        run: npx electron-builder --linux --publish never

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" dist/kubernetes-dashboard-*.AppImage --clobber
          if [ -f dist/latest-linux.yml ]; then
            gh release upload "$RELEASE_TAG" dist/latest-linux.yml --clobber
          fi
